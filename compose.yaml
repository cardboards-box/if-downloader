services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: app:local
    init: true
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    security_opt:
      - no-new-privileges:true
